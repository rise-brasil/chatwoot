name: Deploy Chatwoot to Staging (GHCR + Coolify)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rise-brasil/chatwoot

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean enterprise folders (CE build)
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set Chatwoot edition
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deploy Webhook
        run: |
          if [ -z "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" ]; then
            echo "Aviso: A secret COOLIFY_DEPLOY_WEBHOOK não está configurada no GitHub. O deploy automático na VPS foi ignorado."
          else
            echo "Disparando deploy no Coolify..."
            curl -i -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}"
          fi
